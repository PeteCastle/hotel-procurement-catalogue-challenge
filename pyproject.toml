[project]
name = "hotel-procurement-catalogue-challenge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "joblib>=1.4",
    "kaggle>=2.2.5",
    "kagglehub>=1.0.3",
    "matplotlib>=3.9.2",
    "numpy>=2.1",
    "optuna>=5.0.0",
    "pandas>=2.2.3",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5.2",
    "scipy>=1.14",
    "seaborn>=0.13.2",
    "symspellpy>=6.7",
    "tabulate>=0.9",
    "wordsegment>=1.3",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jsonschema>=4",
    "jupyter-client>=8.6",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8",
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
